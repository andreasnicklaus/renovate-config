name: Validate Renovate config

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
      - name: Validate renovate config
        run: npx --yes --package renovate -- renovate-config-validator --no-global default.json